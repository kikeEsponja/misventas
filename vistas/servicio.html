<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../estilos/productos.css">
    <link rel="icon" href="../../imagenes/shortcut.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Productos</title>
</head>
<body>
    <header class="bg-dark">
        <nav>
            <div class="desktop">
                <h1 class="text-light" id="producto"></h1>
                <p class="text-light" id="descripcion"></p>
            </div>
        </nav>
    </header>
    <main>
        <div class="producto">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner" id="item">
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                	<span class="carousel-control-prev-icon bg-dark" aria-hidden="true"></span>
                	<span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                	<span class="carousel-control-next-icon bg-dark" aria-hidden="true"></span>
                	<span class="visually-hidden">Next</span>
                </button>
            </div>
            <aside id="detalles"></aside>
        </div>
        <section>
            <div class="otros_productos"></div>
        </section>
        <section>
            <div class="descripcion"></div>
            <div class="especificaciones"></div>
           <br>
        </section>
    </main>
    <footer>
        <div>
            <div class="footer_contenedor">
                <div class="redes">
                    <div>
                        <a href="#"><i class="bi bi-facebook"></i></a>
                    </div>
                    <div>
                        <a href="#"><i class="bi bi-instagram"></i></a>
                    </div>
                    <div>
                        <a href="#"><i class="bi bi-youtube"></i></a>
                    </div>
                </div>
            </div>
            <div class="text-center text-light">
                <small>kikeEsponja: </small>
                <small>element3999@gmail.com</small>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../funcionalidades/app_servicios.js"></script>
</body>
</html>
