<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        const token = localStorage.getItem('token_admin');

<body>
    <header class="bg-dark">
        <nav>
            <div class="desktop">
                <h1 class="text-light">ADMINISTRADOR</h1>
            </div>
        </nav>
    </header>
    <main class="bg-secondary">
        <section>
            <form method="POST" id="admin_formulario">
                <h2>Agregar Producto</h2>
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre">
                </div>
                <div>
                    <label for="direcc">URL</label>
                    <input type="text" name="direcc" id="direcc">
                </div>
                <div>
                    <label for="marca">Marca</label>
                    <input type="text" name="marca" id="marca">
                </div>
                <div>
                    <label for="precio">Precio</label>
                    <input type="number" name="precio" id="precio">
                </div>
                <div>
                    <label for="imagen">Imagen</label>
                    <input type="file" name="imagen" id="imagen">
                </div>
                <div>
                    <label for="cantidad">Cantidad</label>
                    <input type="number" name="cantidad" id="cantidad">
                </div>
                <div>
                    <label for="cond">Condición</label>
                    <select title="condición" name="cond" id="cond">
                        <option value="nuevo">Nuevo</option>
                        <option value="usado">Usado</option>
                    </select>
                </div>
                <button class="btn btn-info" type="submit">Agregar</button>
            </form>
            <hr>

            <form method="POST" action="/modificar">
                <h2>Modificar Producto</h2>
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre">
                </div>
                <div>
                    <label for="direcc">URL</label>
                    <input type="text" name="direcc" id="direcc">
                </div>
                <div>
                    <label for="marca">Marca</label>
                    <input type="text" name="marca" id="marca">
                </div>
                <div>
                    <label for="precio">Precio</label>
                    <input type="number" name="precio" id="precio">
                </div>
                <div>
                    <label for="imagen">Imagen</label>
                    <input type="file" name="imagen" id="imagen">
                </div>
                <div>
                    <label for="cantidad">Cantidad</label>
                    <input type="number" name="cantidad" id="cantidad">
                </div>
                <button class="btn btn-warning" type="submit">Modificar</button>
            </form>
            <hr>
            <form method="POST" action="/eliminar">
                <h2>Eliminar Producto</h2>
                <div>
                    <label for="id">ID</label>
                    <input type="text" name="id" id="id">
                </div>
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre">
                </div>
                <button class="btn btn-danger" type="submit">Eliminar</button>
            </form>
        </section>
    </main>
    <footer>
        <div>
            <div class="footer_contenedor">
 
                <div class="redes">
                    <div>
                        <a href="#"><i class="bi bi-facebook"></i></a>

            <div class="text-center text-light">
