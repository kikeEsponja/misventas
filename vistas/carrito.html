<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../estilos/carrito.css">
    <link rel="icon" href="../imagenes/shortcut.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>carrito</title>

</head>
<body>
    <header>
        <nav>
        </nav>
    </header>
    <main class="carrito">
        <div>
            <p class="letra_chica">Los productos de tu carro de compras pueden agotarse próximamente. <span class="desaparecer">Cómpralos pronto para que no te quedes sin ellos.</span></p>
            <table border="1">
                <thead>
                    <tr>
                        <th style="width: 25%;">Artículo</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="carrito-contenido"></tbody>
            </table>
        </div>
        <div class="contenedor_resumen">
            <div id="resumen" class="resumen">
                <h2>Resumen</h2>
                <h6><span id="total_productos"></span> Productos</h6>
                <div>
                    <p>Subtotal: <span id="total_sub"></span></p>
                    <h6>Total: <span id="total_total"></span></h6>
                </div>
                <a class="btn btn-primary" title="social-icon" target="_blank" disabled>
                    Comprar
                    <i class="bi bi-whatsapp"></i>
                </a>
                <button class="btn btn-danger" id="vaciar">Vaciar carrito</button>
                <button class="btn btn-warning" id="volver">Volver</button>
            </div>
        </div>
    </main>
    <footer>
        <div></div>
        <div class="logo"></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script>
    </script>
    <script src="../funcionalidades/carrito.js" defer></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>
    </script>
</body>
</html>
