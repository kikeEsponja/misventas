<!DOCTYPE html>

        <meta charset="UTF-8">

    <body>
        <main>
            <h1>Panel de administrador</h1>
            <h2>Nuevo producto</h2>
            <!-- PARTE NUEVA DE CREAR PRODUCTO-->
            <input id="titulo" placeholder="Título">
            <input id="marca" placeholder="Marca">
            <input id="cantidad" placeholder="Ingrese cantidad disponible">
            <input id="precio" placeholder="Precio">
            <textarea id="descripcion" placeholder="Breve descripción"></textarea>
            <input id="imagen" placeholder="Ruta imagen">
            <select id="estado">
                <option value="nuevo">Nuevo</option>
                <option value="usado">Usado</option>
                <option value="servicio">Servicio</option>
            </select>
            <input id="calle" placeholder="Calle">
            <input id="localidad" placeholder="Localidad">
            <input id="altura" placeholder="Altura">
            <button onclick="crearProducto()">Guardar</button>
            <button onclick="salir()">Salir</button>
        </main>
        <script>
            async function crearProducto(){

                const token = localStorage.getItem("token");

                const tipoSeleccionado = estado.value;

                // Mapear a endpoint
                const endpointMap = {
                    nuevo: "productos-nuevos",
                    usado: "productos-usados",
                    servicio: "productos-servicios"
                };

                const endpoint = endpointMap[tipoSeleccionado];
                //const direccion = `../vistas/${tipoSeleccionado}.html`;
                //const res = await fetch("https://ventas-backend-wj4v.onrender.com/productos-usados",{
                //const res = await fetch(`http://localhost:3000/${endpoint}`, {
                const res = await fetch(`https://ventas-backend-wj4v.onrender.com/${endpoint}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    nombre: titulo.value,
                    marca: marca.value,
                    cantidad: Number(cantidad.value),
                    precio: Number(precio.value),
                    condicion: tipoSeleccionado,
                    imagen: [imagen.value],
                    vendedor: "Nombre visible",
                    descripcion: descripcion.value,
                    ubicacion: {
                        calle: calle.value,
                        altura: altura.value,
                        localidad: localidad.value
                    },
                    direcc: `../vistas/${tipoSeleccionado}.html`
                })
            });

                const data = await res.json();
                alert("Producto creado");
            }
