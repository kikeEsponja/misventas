            // Nueva versión de crearProducto que maneja múltiples imágenes y es más modular.
            async function crearProducto(){

                const token = localStorage.getItem("token");
                //const tipoSeleccionado = estado.value; 
                const tipoSeleccionado = document.getElementById("estado").value;

                const endpointMap = {
                    nuevo: "productos-nuevos",
                    usado: "productos-usados",
                    servicio: "productos-servicios"
                };
            
                const endpoint = endpointMap[tipoSeleccionado];
            
                const files = document.getElementById("imagenes").files;
            
                if(files.length === 0){
                    alert("Sube al menos una imagen, artista 🎨");
                    return;
                }

                // 🔥 subir imágenes
                const urlsImagenes = await subirImagenes(files);

                const res = await fetch(`https://ventas-backend-wj4v.onrender.com/${endpoint}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        nombre: titulo.value,
                        marca: marca.value,
                        cantidad: Number(cantidad.value),
                        precio: Number(precio.value),
                        condicion: tipoSeleccionado,
                        estado: "disponible",
                        imagen: urlsImagenes, // 👈 BOOM 💥
                        vendedor: "Nombre visible",
                        direcc: `../vistas/${tipoSeleccionado}.html`
                    })
                });

                const data = await res.json();
                alert("Producto creado con estilo 😎");
            }

            async function subirImagenes(files){
                const urls = [];

                for(let file of files){
                    const formData = new FormData();
                    formData.append("imagen", file);
                
                    const res = await fetch("https://ventas-backend-wj4v.onrender.com/subir-imagen", {
                        method: "POST",
                        body: formData
                    });
                
                    const data = await res.json();
                    urls.push(data.url);
                }
                return urls;
            }

            // Función para mostrar los productos (debes llamarla al cargar la página)
            async function renderizarProductosAdmin(productos, tipo) {
                const contenedor = document.getElementById("contenedor-productos");
                contenedor.innerHTML = "";

                productos.forEach(prod => {
                    const estaAgotado = prod.cantidad === 0;

                    contenedor.innerHTML += `
                        <div class="producto-card" style="border: 1px solid #ccc; padding: 15px; margin: 10px; border-radius: 8px;">
                            <h3>${prod.nombre}</h3>
                            <p><strong>Stock actual:</strong> ${prod.cantidad}</p>

                            ${estaAgotado ? `
                                <div style="background: #fff3f3; padding: 10px; border-radius: 5px; border: 1px solid #ffcccc;">
                                    <p style="color:red;">⚠️ <strong>¡PRODUCTO AGOTADO!</strong></p>
                                    <button onclick="marcarVendido('${tipo}', '${prod._id}')" style="background: #ff4444; color: white; padding: 5px 10px; cursor: pointer;">Dar de baja (Vendido)</button>
                                    <button onclick="reponerStock('${tipo}', '${prod._id}')" style="background: #44bb44; color: white; padding: 5px 10px; cursor: pointer;">Reponer Stock</button>
                                </div>
                            ` : `
                                <div style="background: #f0f9ff; padding: 10px; border-radius: 5px; border: 1px solid #bae6fd;">
                                    <p style="color: #0369a1;">✅ Disponible</p>
                                    <label>Cantidad a descontar:</label>
                                    <input type="number" min="1" max="${prod.cantidad}" id="venta-${prod._id}" value="1" style="width: 50px;">
                                    <button onclick="vender('${tipo}', '${prod._id}', ${prod.cantidad})" style="background: #0ea5e9; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
                                        💸 Registrar Venta
                                    </button>
                                </div>
                            `}
                        </div>
                    `;
                });
            }

            async function vender(tipo, id, stockActual) {
                const input = document.getElementById(`venta-${id}`);
                const cantidadVenta = Number(input.value);

                if (cantidadVenta <= 0 || cantidadVenta > stockActual) {
                    alert("Cantidad no válida o superior al stock disponible");
                    return;
                }

                const res = await fetch(`https://ventas-backend-wj4v.onrender.com/vender/${tipo}/${id}`, {
                    method: "PUT",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify({ cantidadVendida: cantidadVenta })
                });

                if (res.ok) {
                    alert("¡Venta registrada con éxito! 💸");
                    location.reload();
                } else {
                    alert("Error al registrar la venta");
                }
            }

            async function marcarVendido(tipo, id) {
                const token = localStorage.getItem("token");
                const confirmar = confirm("¿Seguro que quieres marcarlo como vendido? Esto lo quitará de la vista pública.");

                if (confirmar) {
                    const res = await fetch(`https://ventas-backend-wj4v.onrender.com/marcar-vendido/${tipo}/${id}`, {
                        method: "PUT",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        alert("Producto actualizado 😎");
                        location.reload(); // Recargamos para ver los cambios
                    }
                }
            }

            async function reponerStock(tipo, id) {
                const token = localStorage.getItem("token");
                const nuevaCantidad = prompt("¿Cuántas unidades vas a agregar?");
    
                if (nuevaCantidad && !isNaN(nuevaCantidad)) {
                    const res = await fetch(`https://ventas-backend-wj4v.onrender.com/reponer/${tipo}/${id}`, {
                        method: "PUT",
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({ cantidad: nuevaCantidad })
                    });
                    
                    if (res.ok) {
                        alert("Stock actualizado 💪");
                        location.reload();
                    }
                } else {
                    alert("Cantidad no válida");
                }
            }

            async function cargarMisProductos(){
                const res = await fetch(`https://ventas-backend-wj4v.onrender.com/${tipoSeleccionado}`);
                const data = await res.json();

                renderizarProductosAdmin(data, tipoSeleccionado);
            }

            cargarMisProductos();

            function salir() {
                localStorage.removeItem("token");
                location.href = "login.html";
            }
