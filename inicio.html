<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./estilos/estilos.css">
    <link rel="icon" href="./imagenes/shortcut.png">
    <title>Artículos</title>
</head>
<body>
    <header>
        <nav>
            <div class="desktop">
                <div class="volver text-center">
                    <h1 class="text-light"> PUNTOMARKET </h1>
                    <h2 id="pais_texto"></h2>
                    <button class="btn btn-warning" id="inicio">Inicio</button>
                </div>
            </div>
        </nav>
    </header>
    <main>
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Si no eres el administrador, pulsa el botón "cerrar"</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <h2>CONTRASEÑA!</h2>
                    <form id="formulario">
                        <input type="password" placeholder="contraseña" id="contras">
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>                    
                </div>
            </div>
        </div>
    </div>
        <section class="grilla">
            <div class="card">
                <button class="tipo-btn" data-tipo="nuevos">
                    <img src="./imagenes/nuevos.jpg" class="card-img-top" alt="Nuevos">
                </button>
                <p class="card-text text-center">PRODUCTOS NUEVOS</p>
            </div>
            <div class="card">
                <button class="tipo-btn" data-tipo="usados">
                    <img src="./imagenes/usados.webp" class="card-img-top" alt="Usados">
                </button>
                <p class="card-text text-center">PRODUCTOS USADOS</p>
            </div>
            <div class="card">
                <button class="tipo-btn" data-tipo="servicios">
                    <img src="./imagenes/servicios.avif" class="card-img-top" alt="Servicios">
                </button>
                <p class="card-text text-center">SERVICIOS</p>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <div class="footer_contenedor">
                <div class="redes">
                    <div>
                        <a href="#"><i class="bi bi-facebook"></i></a>
                    </div>
                    <div>
                        <a href="#"><i class="bi bi-instagram"></i></a>
                    </div>
                    <div>
                        <a href="#"><i class="bi bi-youtube"></i></a>
                    </div>
                </div>
            </div>
            <div class="text-center text-light">
                <small>kikeEsponja: </small>
                <small>element3999@gmail.com</small>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
    </script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>
        document.querySelectorAll('.tipo-btn').forEach(btn =>{
            btn.addEventListener('click', () =>{
                const tipo = btn.dataset.tipo;
                localStorage.setItem('tipo', tipo);

                window.location.href = './vistas/listado.html';
            });
        });

        const pais = localStorage.getItem('pais');
        if(!pais){
            alert('EEEEEKK, Fuera!');
            window.location.href = './index.html';
        }

        if(pais === 'AR'){
            document.getElementById('pais_texto').textContent = 'ARGENTINA';
        }else if(pais === 'VE'){
            document.getElementById('pais_texto').textContent = 'VENEZUELA';
        }else if(pais === 'BR'){
            document.getElementById('pais_texto').textContent = 'BRASIL';
        }else if(pais === 'PE'){
            document.getElementById('pais_texto').textContent = 'PERÚ';
        }else if(pais === 'ES'){
            document.getElementById('pais_texto').textContent = 'ESPAÑA';
        }else{
            document.getElementById('pais_texto').textContent = 'ZONA DESCONOCIDA';
        }

        document.getElementById('inicio').addEventListener('click', () =>{
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
