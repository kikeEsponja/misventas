    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
    </script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>

        document.querySelectorAll('.pais-btn').forEach(btn =>{
            btn.addEventListener('click', () =>{
                const pais = btn.dataset.pais;
                localStorage.setItem('pais', pais);

                window.location.href = './inicio.html';
            });
        });

        function irAdmin(){
            window.location.href = "./vistas/admin_login.html";
        }
        async function verificarPendientes() {
            const token = localStorage.getItem("token");
            if (!token) return;

            try {
                const res = await fetch("https://ventas-backend-wj4v.onrender.com/conteo-pendientes", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
            
                const punto = document.getElementById("punto-notificacion");

                if (data.total > 0) {
                    punto.style.display = "block"; // ¡Aparece el puntito rojo!
                    punto.style.backgroundColor = "#ff4d4d"; // Rojo vibrante
                    console.log(`Tienes ${data.total} productos esperando aprobación.`);
                } else {
                    punto.style.display = "block";
                    punto.style.backgroundColor = "#444"; // Cambia a un gris oscuro para indicar que no hay pendientes
                }
            } catch (error) {
                console.error("No se pudo verificar pendientes:", error);
            }
        }

        verificarPendientes();

        setInterval(verificarPendientes, 300000);
    </script>
